appId: com.mehmetfiskindal.fiotp
productName: fiotp
directories:
  buildResources: build
  output: release
files:
  - out/**
  - build/icon.png
  - package.json
linux:
  target:
    - AppImage
  category: Utility
  icon: build/icon.png
win:
  target:
    - target: NSIS
      arch:
        - x64
        - ia32
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.utilities
